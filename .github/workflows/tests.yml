name: PowerShell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run regression suite
        shell: pwsh
        run: |
          & ${{ matrix.engine }} -NoProfile -File ./tests/Run-Tests.ps1
          exit $LASTEXITCODE
      - name: Demo HTML smoke test
        shell: pwsh
        run: |
          & ${{ matrix.engine }} -NoProfile -File ./Invoke-SecurityAudit.ps1 -Demo -Format Html -OutputPath ./reports/demo.html
          exit $LASTEXITCODE
  portable-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run portable regression suite
        shell: pwsh
        run: ./tests/Run-Tests.ps1
